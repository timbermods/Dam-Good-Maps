name: Live check

# Checks the deployed site against main: it loads without page or console errors, stays noindex
# until launch, and its download for one spec is the file tools/gen.ts makes, byte for byte
# (tests/live). Runs daily and by hand (against main), and after every deploy: deploy.yml calls it
# with the commit it deployed. It has no workflow_run trigger, so nothing privileged checks out code
# from another run. A failure opens an issue labelled "deploy", or comments on the open one.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The commit to compare the live site with (deploy.yml passes the one it deployed)
        type: string
        required: false

permissions:
  contents: read
  issues: write

jobs:
  live:
    concurrency:
      group: live-check
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # called by deploy.yml: the commit it deployed (a push to main); otherwise main
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Live site against tools/gen.ts
        run: npx playwright test -c playwright.live.config.ts
        env:
          DGM_PUBLIC: ${{ vars.DGM_PUBLIC }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: live-check-report
          path: playwright-report/
          retention-days: 7
      - name: Open an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create deploy --color B60205 --description "The live site and its deploys" 2>/dev/null || true
          body="The live check failed: $RUN_URL"
          open=$(gh issue list --label deploy --state open --json number,title --jq 'map(select(.title == "Live check failed"))[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "Live check failed" --label deploy --body "$body"
          fi
