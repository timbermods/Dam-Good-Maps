name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: prototype/requirements.txt
      - run: npm ci
      - run: pip install -r prototype/requirements.txt
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and contract tests
        run: npm test
      - name: Python oracle (validate.py load checks and round trip)
        run: npm run oracle -- --seeds 1-5 --sizes 96,128,256
      - name: Generation time (128² under 3 s)
        run: npm run bench
      - name: Build
        run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Browser tests (Node and Chromium produce the same bytes)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
